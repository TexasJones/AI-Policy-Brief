name: Refresh AI jobs
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scrape employer boards
        run: python -m ai_policy_brief.jobs_scraper
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # History is committed on purpose: the week-over-week comparison
          # needs yesterday's snapshot, and a fresh checkout has none.
          git add data/ai-feed.xml data/ai_job_history.json data/ai_hiring_pulse.json
          git diff --staged --quiet || git commit -m "Daily update: AI jobs data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
