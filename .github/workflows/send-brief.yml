name: Send Polly AI Brief
run-name: ${{ (inputs.test_to != '' && inputs.preview) && 'Polly AI Brief (TEST + preview also checked)' || (inputs.test_to != '' && 'Polly AI Brief (TEST)') || (inputs.preview && 'Polly AI Brief (PREVIEW)') || 'Polly AI Brief' }}
# Triggered by an external scheduler (workflow_dispatch) at 7:00 a.m. Eastern.
# The gate below only lets Friday and Saturday through (The Polly Brief, a
# separate repo, covers Mon-Thu), so the scheduler can call this every day
# without sending on the wrong days.
on:
  workflow_dispatch:
    inputs:
      test_to:
        description: "Comma-separated emails. If set, sends a TEST to them only and records no state."
        required: false
        default: ""
      allow_off_day:
        description: "Run even if today is not Friday or Saturday (Eastern)"
        type: boolean
        default: false
      preview:
        description: "Build with real live jobs/news and publish the web page for review, but do not email anyone and do not mark anything as used"
        type: boolean
        default: false
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    env:
      TEST_TO: ${{ inputs.test_to }}
      ALLOW_OFF_DAY: ${{ inputs.allow_off_day }}
      PREVIEW: ${{ inputs.preview }}
    steps:
      - id: g
        run: |
          dow=$(TZ=America/New_York date +%u)   # 1=Mon ... 7=Sun
          if [ "$dow" = "5" ] || [ "$dow" = "6" ] || [ "$ALLOW_OFF_DAY" = "true" ] || [ -n "$TEST_TO" ] || [ "$PREVIEW" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a send day (Eastern weekday $dow); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  send:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      TEST_TO: ${{ inputs.test_to }}
      PREVIEW: ${{ inputs.preview }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: Polly AI Brief
      MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
      SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Skip if this issue was already sent
        id: chk
        if: env.TEST_TO == '' && inputs.preview != true
        run: python -m ai_policy_brief.send --check
      - name: Refresh jobs (keeps the last committed feed if the scrape fails)
        if: steps.chk.outputs.sent != 'true'
        continue-on-error: true
        run: python -m ai_policy_brief.jobs_scraper
      - name: Build issue
        if: steps.chk.outputs.sent != 'true'
        run: python -m ai_policy_brief.generate
      - name: Publish web copy
        if: steps.chk.outputs.sent != 'true' && env.TEST_TO == ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs data
          git diff --staged --quiet || git commit -m "Publish issue"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
      - name: Send via Brevo
        # A test send (test_to set) always goes out, even if "preview" was
        # also checked by mistake -- it only ever reaches the given address,
        # so there's no reason to let a stray preview checkbox silently
        # swallow it (this happened live: a run named "(TEST)" completed
        # successfully with this step skipped and nothing landed in the
        # inbox, because preview was also checked and this condition used to
        # require preview != true unconditionally).
        if: steps.chk.outputs.sent != 'true' && (env.TEST_TO != '' || inputs.preview != true)
        run: |
          if [ -n "$TEST_TO" ]; then
            python -m ai_policy_brief.send --test-to "$TEST_TO"
          else
            python -m ai_policy_brief.send
          fi
      - name: Record what this issue used
        # Deliberately NOT gated on steps.chk.outputs.sent: if a previous run
        # sent successfully via Brevo but died before this step committed and
        # pushed, data/pending_state.json is still sitting in the repo (the
        # Publish step above commits it BEFORE the send). --commit-state is a
        # no-op when there is nothing pending, so running this unconditionally
        # (whenever we're not in test or preview mode) lets that leftover
        # state get committed on the very next run, live or
        # watchdog-triggered, instead of staying stuck forever behind a "we
        # already sent, skip everything" gate. Preview mode never emailed
        # anyone, so nothing it built should be marked as delivered.
        if: env.TEST_TO == '' && inputs.preview != true
        run: |
          python -m ai_policy_brief.generate --commit-state
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --staged --quiet || git commit -m "Record issue state"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
