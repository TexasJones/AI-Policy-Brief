name: Send AI Policy Brief
# Triggered by an external scheduler (workflow_dispatch) at 7:00 a.m. Eastern.
# The gate below only lets Tuesday and Friday through, so the scheduler can
# call this every day without sending on the wrong days.
on:
  workflow_dispatch:
    inputs:
      test_to:
        description: "Comma-separated emails. If set, sends a TEST to them only and records no state."
        required: false
        default: ""
      allow_off_day:
        description: "Run even if today is not Tuesday or Friday (Eastern)"
        type: boolean
        default: false
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          dow=$(TZ=America/New_York date +%u)   # 1=Mon ... 7=Sun
          if [ "$dow" = "2" ] || [ "$dow" = "5" ] || [ "${{ inputs.allow_off_day }}" = "true" ] || [ -n "${{ inputs.test_to }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a send day (Eastern weekday $dow); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  send:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
      BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: AI Policy Brief
      MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
      SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh jobs (falls back to the last committed feed)
        continue-on-error: true
        run: python -m ai_policy_brief.jobs_scraper
      - name: Build issue
        run: python -m ai_policy_brief.generate
      - name: Publish web copy
        if: inputs.test_to == ''
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/briefs data/ai-feed.xml data/ai_job_history.json data/ai_hiring_pulse.json
          git diff --staged --quiet || git commit -m "Publish issue"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Send via Brevo
        run: |
          if [ -n "${{ inputs.test_to }}" ]; then
            python -m ai_policy_brief.send --test-to "${{ inputs.test_to }}"
          else
            python -m ai_policy_brief.send
          fi
      - name: Record what this issue used
        if: inputs.test_to == ''
        run: |
          python -m ai_policy_brief.generate --commit-state
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/recent_stories.json data/last_issue.json data/seen_jobs.json
          git diff --staged --quiet || git commit -m "Record issue state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
